site_name: MOD Fish Processing
site_description: Documentation for the MOD_fish_processing pipeline
repo_url: https://github.com/modscripps/MOD_fish_processing
repo_name: modscripps/MOD_fish_processing
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Workflow:
      - "L0: converting .modraw to .mat": workflow/L0_modraw_conversion.md
      - "Zero-padding numbered raw filenames": workflow/pad_raw_filenames.md
  - Concepts:
      - Overview: concepts/index.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
