site_name: MOD Fish Processing
site_description: Documentation for the MOD_fish_processing pipeline
repo_url: https://github.com/modscripps/MOD_fish_processing
repo_name: modscripps/MOD_fish_processing
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Workflow:
      - "Pipeline overview: realtime vs. postprocess": workflow/pipeline_overview.md
      - "modraw → L0: converting .modraw to .mat": workflow/modraw_to_L0_conversion.md
      - ".modraw tag reference": workflow/modraw_tag_format.md
      - "Zero-padding numbered raw filenames": workflow/pad_raw_filenames.md
      - "L0 → L1: converting raw counts to physical units": workflow/L0_to_L1_conversion.md
      - "L1 → L2: downcast-gated spectra": workflow/L1_to_L2_conversion.md
      - "FP07 calibration and chi": workflow/L2_calc_chi.md
      - "Epsilon (shear turbulence)": workflow/L2_calc_eps.md
      - "Profile detection and extraction": workflow/profile_detection.md
  - Concepts:
      - Overview: concepts/index.md
      - "Choosing fft_length, fft_segments_per_scan, and scan_overlap": concepts/spectral_windowing.md
  - References: references.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mfp-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js
  - javascripts/mermaid-zoom.js

plugins:
  - search
  - glightbox
