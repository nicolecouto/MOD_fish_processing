# Start New Deployment - cruise-level settings. Edit once per cruise.
# Paths use the network names (/Volumes/DEV1_HD/..., /Volumes/DEV3_HD/...) so
# they are the same from every computer - on DEV1 itself, /Volumes/DEV1_HD is
# its own disk.

# Folder holding fctd_epsi and its Setup file (DEV1)
setup_dir: /Volumes/DEV1_HD/Users/Shared/Software_current_cruise/MOD_fish_lib/Acquisition/fctd_epsi_acq/build/fctd_epsi/Build/Products/Debug

# Processed data (DEV3): dev1_setup.yml goes in <processed_root>/<survey>/meta/
processed_root: /Volumes/DEV3_HD/Users/Shared/EPSI_PROCESSING/Current_Cruise/Processed

# One row per Create Setup
deployment_log: /Volumes/DEV3_HD/Users/Shared/EPSI_PROCESSING/Current_Cruise/Processed/deployment_log.csv

# Defaults for the window
cruise: MURI
experiment: MURI_2026
latitude: 35

# --- Setup values shared by every vehicle (deck hardware) ---
# Calibrations folder - one place for acquisition and processing: a clone of
# the MOD_fish_calibrations repo next to the software on DEV1, so cal files
# are updated there (git pull) separately from the code. DEV3 reads it over
# the network at the same /Volumes/DEV1_HD path. It holds
#   SBE/<SN>.CAL                          CTD
#   SHEAR_PROBES/<SN>/Calibration_<SN>.txt shear probes (slots 3-4 in fctd_epsi)
#   FPO7/<SN>/Calibration_<SN>.txt         FP07 probes (slots 1-2 in fctd_epsi)
#   SHEAR/cap1nFres200Meg_5KohmInput.mat   shear charge-amp response (processing only)
# Setup gets <folder>/SBE, <folder>/SHEAR_PROBES and <folder>/FPO7 (fctd_epsi
# records N/A for any probe file it can't find); dev1_setup.yml gets
# calibrations_root: <folder> for processing.
calibrations_root: /Volumes/DEV1_HD/Users/Shared/Software_current_cruise/MOD_fish_calibrations
# Serial ports
command_port: /dev/tty.usbserial-FTU7BXC3
ctd_port: /dev/tty.usbserial-AV0K4NN9
speed: 230400
pcode_in_use: true
pcode_port: /dev/tty.usbserial-FT3T18M2
pcode_speed: 4800
# Network
tcpip_port: 2342
udp_in_use: true
udp_port: 50210
# CTD data
ctd_length: 114
output_format: 24
print_data: 2
eng_disp_rate: 8
# Raw files (the file name prefix is the fish type: EPSI for a Mako, FCTD for an FCTD)
data_path: /Users/Shared/FCTD_EPSI_DATA/Current_Cruise/
file_size: 5000000
